<style>
  :root {
    /* 日常亲切风 (Warm Cozy Handcraft Palette) */
    --bg-base: #FBF9F5;
    --bg-surface: #FFFFFF;
    --bg-subtle: #F6F2EB;
    --bg-hover: #EFE9DE;
    --border: #E8E0D5;
    --border-light: #F0EBE1;
    --text-main: #2D2724;
    --text-muted: #797167;
    --text-light: #A39B90;
    --accent: #E07A5F;
    --accent-hover: #D0694E;
    --accent-subtle: #FDF2EE;
    --accent-border: #F7D4C8;
    --secondary-accent: #6B8E7C;
    --danger: #E55353;
    --danger-subtle: #FDEDEC;
    --shadow-sm: 0 1px 3px rgba(65, 45, 30, 0.05), 0 1px 2px rgba(65, 45, 30, 0.04);
    --shadow-md: 0 4px 16px rgba(65, 45, 30, 0.08), 0 2px 6px rgba(65, 45, 30, 0.04);
    --shadow-lg: 0 10px 30px rgba(65, 45, 30, 0.12), 0 4px 10px rgba(65, 45, 30, 0.06);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-full: 9999px;
    --sidebar-w: 260px;
    --sidebar-collapsed-w: 64px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-base);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
  }

  /* 主应用容器：双栏布局 */
  #app-layout {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ---------- 可伸缩侧边栏 ---------- */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: width 0.24s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.24s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 20;
    user-select: none;
  }
  #sidebar.collapsed {
    width: var(--sidebar-collapsed-w);
    min-width: var(--sidebar-collapsed-w);
  }
  #sidebar.collapsed .sidebar-header {
    padding: 14px 0;
    justify-content: center;
  }
  #sidebar.collapsed .brand-wrap {
    display: none;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-light);
    height: 60px;
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
  }
  .brand-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #E07A5F, #F28E2B);
    color: #fff;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    box-shadow: 0 2px 6px rgba(224, 122, 95, 0.35);
    flex-shrink: 0;
  }
  .brand-info {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    white-space: nowrap;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-main);
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-light);
  }
  #sidebar.collapsed .brand-info {
    display: none;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover {
    background: var(--bg-subtle);
    color: var(--text-main);
    border-color: var(--border-light);
  }

  .sidebar-add-wrap {
    padding: 12px 14px;
  }
  .btn-add-folder {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--accent-subtle);
    color: var(--accent);
    border: 1px dashed var(--accent-border);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
  }
  .btn-add-folder:hover {
    background: var(--accent);
    color: #fff;
    border-style: solid;
    border-color: var(--accent);
    box-shadow: 0 3px 8px rgba(224, 122, 95, 0.25);
  }
  #sidebar.collapsed .btn-add-folder {
    padding: 8px;
  }
  #sidebar.collapsed .btn-add-folder span {
    display: none;
  }

  .sidebar-nav-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 8px 16px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #sidebar.collapsed .sidebar-nav-title {
    display: none;
  }

  .folder-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .folder-list::-webkit-scrollbar { width: 4px; }
  .folder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: var(--radius-md);
    cursor: pointer;
    position: relative;
    color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
  }
  .folder-item:hover {
    background: var(--bg-subtle);
    color: var(--text-main);
  }
  .folder-item.active {
    background: var(--accent-subtle);
    color: var(--accent);
    font-weight: 600;
  }
  .folder-item.active::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .folder-item-icon {
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    flex-shrink: 0;
  }
  .folder-item-details {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .folder-item-name {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .folder-item-sub {
    font-size: 11px;
    color: var(--text-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .folder-item.active .folder-item-sub {
    color: var(--accent);
    opacity: 0.85;
  }
  .folder-item-actions {
    display: none;
    align-items: center;
    gap: 2px;
    margin-left: auto;
  }
  .folder-item:hover .folder-item-actions {
    display: flex;
  }
  .folder-action-btn {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-light);
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }
  .folder-action-btn:hover {
    background: rgba(0,0,0,0.06);
    color: var(--text-main);
  }
  .folder-action-btn.danger:hover {
    color: var(--danger);
    background: var(--danger-subtle);
  }

  #sidebar.collapsed .folder-item {
    justify-content: center;
    padding: 10px 0;
  }
  #sidebar.collapsed .folder-item-details,
  #sidebar.collapsed .folder-item-actions {
    display: none;
  }

  .sidebar-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 11px;
    color: var(--text-light);
    background: var(--bg-surface);
  }
  .sidebar-footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .btn-clear-cache {
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    width: 100%;
    transition: all 0.15s ease;
  }
  .btn-clear-cache:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-subtle);
  }
  #sidebar.collapsed .sidebar-footer {
    display: none;
  }

  /* ---------- 主内容区 ---------- */
  #main-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    position: relative;
    background: var(--bg-base);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 380px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-base);
    color: var(--text-main);
    outline: none;
    transition: all 0.15s;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }
  .search-wrap input::placeholder { color: var(--text-light); }

  select, .btn-normal {
    font-family: inherit;
    font-size: 13px;
    background: var(--bg-surface);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  select:hover, .btn-normal:hover { border-color: var(--accent); }
  select:disabled, .btn-normal:disabled { opacity: 0.45; cursor: default; }

  .btn-accent {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #fff;
    font-weight: 600;
    border-radius: var(--radius-md);
    padding: 7px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn-accent:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    box-shadow: 0 2px 8px rgba(224, 122, 95, 0.35);
  }
  .btn-accent:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

  label.checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  label.checkbox input { accent-color: var(--accent); cursor: pointer; }

  .spacer { flex: 1; }
  .stats {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    background: var(--bg-subtle);
    padding: 4px 10px;
    border-radius: var(--radius-full);
  }

  /* 状态栏 */
  #status-bar {
    padding: 8px 20px;
    font-size: 12.5px;
    color: var(--accent);
    background: var(--accent-subtle);
    border-bottom: 1px solid var(--accent-border);
    display: none;
    animation: fadeIn 0.15s ease;
  }
  #status-bar.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* 顶级子文件夹过滤胶囊栏 */
  #folder-bar {
    display: none;
    gap: 8px;
    padding: 10px 20px;
    overflow-x: auto;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-light);
  }
  #folder-bar.show { display: flex; }
  #folder-bar::-webkit-scrollbar { height: 4px; }
  #folder-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .folder-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: var(--radius-full);
    background: var(--bg-base);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12.5px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .folder-pill:hover {
    border-color: var(--accent);
    color: var(--text-main);
    background: var(--bg-subtle);
  }
  .folder-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(224, 122, 95, 0.25);
  }
  .folder-pill.fav-pill.active {
    background: #E8A838;
    border-color: #E8A838;
    color: #fff;
    box-shadow: 0 2px 6px rgba(232, 168, 56, 0.35);
  }
  .folder-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .folder-pill .count {
    font-size: 11px;
    opacity: 0.8;
  }

  /* 滚动主视口 */
  #content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  #content-scroll::-webkit-scrollbar { width: 8px; }
  #content-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* 空状态 */
  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: var(--text-muted);
    text-align: center;
    gap: 16px;
    background: var(--bg-surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    margin: 20px auto;
    max-width: 560px;
  }
  #empty-state .empty-icon-wrap {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--accent-subtle);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  #empty-state h3 {
    margin: 0;
    font-size: 17px;
    color: var(--text-main);
  }
  #empty-state .hint {
    font-size: 13px;
    max-width: 440px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  /* 分组与网格 */
  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 4px 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
    font-weight: 700;
  }
  .group-header:first-child { padding-top: 0; }
  .group-header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .group-header .group-name { flex: 1; }
  .group-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-light);
    white-space: nowrap;
  }

  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }

  /* 视频卡片 */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.16s, border-color 0.16s, box-shadow 0.16s;
    position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #181614;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .card:hover .thumb-wrap img {
    transform: scale(1.02);
  }
  .thumb-wrap .placeholder {
    color: rgba(255,255,255,0.4);
  }
  .duration-badge {
    position: absolute;
    bottom: 7px;
    right: 7px;
    background: rgba(28, 23, 20, 0.78);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .ext-badge {
    position: absolute;
    top: 7px;
    left: 7px;
    background: rgba(28, 23, 20, 0.65);
    backdrop-filter: blur(4px);
    color: rgba(255,255,255,0.85);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .ext-badge.non-native {
    background: rgba(229, 83, 83, 0.88);
    color: #fff;
    font-size: 9.5px;
    letter-spacing: 0.3px;
  }

  .card-feed-btn {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(28, 23, 20, 0.75);
    backdrop-filter: blur(4px);
    color: #fff;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    z-index: 2;
    transition: background 0.15s, transform 0.15s;
  }
  .card:hover .card-feed-btn { display: flex; }
  .card-feed-btn:hover {
    background: var(--accent);
    transform: scale(1.1);
  }

  .card-fav-btn {
    position: absolute;
    top: 7px;
    right: 42px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(28, 23, 20, 0.75);
    backdrop-filter: blur(4px);
    color: rgba(255, 255, 255, 0.85);
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    z-index: 3;
    transition: background 0.15s, transform 0.15s, color 0.15s;
  }
  .card:hover .card-fav-btn,
  .card-fav-btn.is-active {
    display: flex;
  }
  .card-fav-btn.is-active {
    color: #F2C94C;
    background: rgba(28, 23, 20, 0.85);
  }
  .card-fav-btn:hover {
    background: var(--accent);
    color: #fff;
    transform: scale(1.1);
  }
  .card.is-non-playable .card-fav-btn {
    right: 7px;
  }

</style>

  function showModalHud(text) {
    if (!modalHud) return;

  function stepPlaybackSpeed(videoEl, direction) {
    if (!videoEl) return 1.0;
    const cur = videoEl.playbackRate || 1.0;
    let closestIdx = 0;
    let minDiff = Infinity;
    for (let i = 0; i < SPEED_LEVELS.length; i++) {
      const diff = Math.abs(SPEED_LEVELS[i] - cur);
      if (diff < minDiff) {
        minDiff = diff;
        closestIdx = i;
      }
    }
    const nextIdx = Math.max(0, Math.min(SPEED_LEVELS.length - 1, closestIdx + direction));
    const nextSpeed = SPEED_LEVELS[nextIdx];
    videoEl.playbackRate = nextSpeed;
    return nextSpeed;
  }

  // ---------- IndexedDB 升级适配层 (含持久化缩略图池与星标收藏) ----------
  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('suishi-video-db', 4);
      req.onupgradeneeded = (e) => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) {
          db.createObjectStore('kv');
        }
        if (!db.objectStoreNames.contains('thumbnails')) {
          db.createObjectStore('thumbnails');
        }
        if (!db.objectStoreNames.contains('favorites')) {
          db.createObjectStore('favorites');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, val) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function loadFavoritesForActiveFolder() {

    try {
      const db = await idbOpen();
      return new Promise((resolve) => {
        const tx = db.transaction('favorites', 'readonly');
        const store = tx.objectStore('favorites');
        const req = store.getAllKeys ? store.getAllKeys() : store.getAll();
        req.onsuccess = () => {
          const keys = req.result || [];
          const prefix = `${activeFolderId}:`;
          keys.forEach(k => {
            const keyStr = typeof k === 'string' ? k : (k && k.key ? k.key : '');
            if (keyStr.startsWith(prefix)) {
              favoriteSet.add(keyStr);
            }
          });
          resolve();

      const db = await idbOpen();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('favorites', 'readwrite');
        const store = tx.objectStore('favorites');
        if (nowFav) {
          store.put({ key, folderId: activeFolderId, name: v.name, path: v.path, addedAt: Date.now() }, key);
        } else {
          store.delete(key);
        }
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });

      if (nowFav) {
        favoriteSet.add(key);

      return map[getProgressKey(v)] || null;
    } catch {

  }

  function savePlaybackProgress(v, currentTime, duration) {
    if (!v || !duration || !isFinite(duration) || duration <= 0) return;
    const key = getProgressKey(v);
    if (!key) return;

    try {
      const raw = localStorage.getItem('suishi_play_progress');
      const map = raw ? JSON.parse(raw) : {};

      // 如果剩余不足 5 秒或已接近末尾，清除续播记录视为看完
      if (duration - currentTime <= 5 || currentTime >= duration - 1) {
        if (map[key]) {
          delete map[key];
          localStorage.setItem('suishi_play_progress', JSON.stringify(map));
        }
        return;
      }

      // 播放超过 5 秒且剩余时长大于 10 秒时保存
      if (currentTime >= 5 && duration - currentTime > 10) {
        map[key] = {
          time: Math.round(currentTime),
          duration: Math.round(duration),
          updatedAt: Date.now()
        };
        localStorage.setItem('suishi_play_progress', JSON.stringify(map));
      }
    } catch {}
  }

  // ---------- 格式与辅助工具 ----------
  function isVideoFile(name) {
    const ext = name.split('.').pop().toLowerCase();
    return VIDEO_EXT.includes(ext);
  }
  function extOf(name) {
    return name.split('.').pop().toLowerCase();
  }
  function fmtSize(bytes) {
    if (bytes == null) return '';
    const units = ['B','KB','MB','GB'];
    let i = 0, v = bytes;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
  }
  function fmtDuration(sec) {
    if (!isFinite(sec) || sec < 0) return '';
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const mm = String(m).padStart(h ? 2 : 1, '0');
    const ss = String(s).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${mm}:${ss}`;
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function setStatus(msg) {
    statusBar.textContent = msg;
    statusBar.classList.toggle('show', !!msg);
  }
  function topFolderOf(v) {
    return (v.path ? v.path.split('/')[0] : '') || ROOT_GROUP;

  function setControlsEnabled(enabled) {
    searchInput.disabled = !enabled;
    btnRefresh.disabled = !enabled;

  // ---------- 目录异步扫描管道 ----------
  async function* walk(dirHandle, path, recursive) {
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file') {
        if (isVideoFile(entry.name)) yield { handle: entry, path, parentHandle: dirHandle };
      } else if (entry.kind === 'directory' && recursive) {
        yield* walk(entry, path ? `${path}/${entry.name}` : entry.name, recursive);
      }
    }
  }

  async function loadActiveFolder() {
    const cur = savedFolders.find(f => f.id === activeFolderId);
    if (!cur) return;

    // 检查权限
    try {
      const perm = await cur.handle.queryPermission({ mode: 'read' });
      if (perm !== 'granted') {
        emptyState.innerHTML = `
          <div class="empty-icon-wrap">🔒</div>
          <h3>需要重新确认读取权限</h3>
          <div class="hint">浏览器安全策略要求在重新打开或恢复会话后确认对文件夹「${cur.customName || cur.name}」的读取权限。</div>
          <button class="btn-accent" id="btn-reauth" style="margin-top:8px;">重新授权并开启</button>`;
        emptyState.style.display = 'flex';
        gridEl.innerHTML = '';
        $('btn-reauth').addEventListener('click', async () => {
          const p = await cur.handle.requestPermission({ mode: 'read' });
          if (p === 'granted') loadActiveFolder();
        });
        return;
      }
    } catch (e) {
      console.error(e);
    }

    allVideos = [];
    gridEl.innerHTML = '';
    emptyState.style.display = 'none';
    setStatus(`正在扫描「${cur.customName || cur.name}」中的视频…`);
    setControlsEnabled(false);

    await loadFavoritesForActiveFolder();

    const recursive = recursiveChk.checked;
    let count = 0;
    try {
      for await (const { handle: fh, path, parentHandle } of walk(cur.handle, '', recursive)) {
        let file;
        try { file = await fh.getFile(); } catch { continue; }
        allVideos.push({
          handle: fh,
          parentHandle,
          name: fh.name,
          path,
          ext: extOf(fh.name),
          size: file.size,
          mtime: file.lastModified,
        });
        count++;
        if (count % 25 === 0) setStatus(`正在扫描「${cur.customName || cur.name}」… 已找到 ${count} 个视频`);
      }
    } catch (err) {
      console.error('扫描出错:', err);
    }

    cur.count = allVideos.length;
    saveFolderState();
    renderSidebar();

    setStatus('');
    setControlsEnabled(true);
    emptyState.style.display = allVideos.length ? 'none' : 'flex';
    if (!allVideos.length) {
      emptyState.innerHTML = `
        <div class="empty-icon-wrap">🍃</div>
        <h3>这里空空如也</h3>
        <div class="hint">该目录（${recursive ? '含子文件夹' : '当前目录'}）未发现受支持的视频文件。</div>`;
    }

    const topKeys = new Set(allVideos.map(topFolderOf));
    hasFolderGroups = topKeys.size > 1;
    activeFolder = null;

    render();
  }

  // ---------- 目录一键重新扫描 (增量感知) ----------
  async function rescanActiveFolder() {
    const cur = savedFolders.find(f => f.id === activeFolderId);
    if (!cur || !cur.handle) return;
    if (btnRefresh.classList.contains('is-spinning')) return;

    btnRefresh.classList.add('is-spinning');
    setStatus(`正在重新扫描「${cur.customName || cur.name}」…`);
    setControlsEnabled(false);

    const recursive = recursiveChk.checked;
    const getKey = (v) => `${v.path ? v.path + '/' : ''}${v.name}`;
    const oldMap = new Map(allVideos.map(v => [getKey(v), v]));
    const scannedVideos = [];
    let addedCount = 0;

    try {
      for await (const { handle: fh, path, parentHandle } of walk(cur.handle, '', recursive)) {
        let file;
        try { file = await fh.getFile(); } catch { continue; }
        const key = `${path ? path + '/' : ''}${fh.name}`;
        const existing = oldMap.get(key);
        if (existing) {
          existing.parentHandle = parentHandle;
          if (existing.mtime === file.lastModified && existing.size === file.size) {
            existing.handle = fh;
            scannedVideos.push(existing);
          } else {
            scannedVideos.push({
              handle: fh,
              parentHandle,
              name: fh.name,
              path,
              ext: extOf(fh.name),
              size: file.size,
              mtime: file.lastModified,
            });
          }
          oldMap.delete(key);
        } else {
          addedCount++;
          scannedVideos.push({
            handle: fh,
            parentHandle,
            name: fh.name,
            path,
            ext: extOf(fh.name),
            size: file.size,
            mtime: file.lastModified,
          });
        }
      }
    } catch (err) {
      console.error('重新扫描出错:', err);
    }

    const removedCount = oldMap.size;
    allVideos = scannedVideos;
    cur.count = allVideos.length;
    await saveFolderState();
    renderSidebar();
    await loadFavoritesForActiveFolder();

    setControlsEnabled(true);
    btnRefresh.classList.remove('is-spinning');

    emptyState.style.display = allVideos.length ? 'none' : 'flex';
    if (!allVideos.length) {
      emptyState.innerHTML = `
        <div class="empty-icon-wrap">🍃</div>
        <h3>这里空空如也</h3>
        <div class="hint">该目录（${recursive ? '含子文件夹' : '当前目录'}）未发现受支持的视频文件。</div>`;
    }

    const topKeys = new Set(allVideos.map(topFolderOf));
    hasFolderGroups = topKeys.size > 1;
    render();

    if (addedCount > 0 || removedCount > 0) {
      setStatus(`扫描完毕：新增 ${addedCount} 个，移除 ${removedCount} 个视频`);
    } else {
      setStatus(`目录已是最新状态，共 ${allVideos.length} 个视频`);
    }
    setTimeout(() => {
      if (statusBar.textContent.startsWith('扫描完毕') || statusBar.textContent.startsWith('目录已是最新')) {
        setStatus('');
      }
    }, 4000);
  }

  btnRefresh.addEventListener('click', rescanActiveFolder);

  // ---------- 检索 + 排序 + 分组 + 渲染 ----------
  function sortGroup(items) {
    const key = sortKeySel.value;
    items.sort((a, b) => {
      let r;
      if (key === 'name') r = a.name.localeCompare(b.name, 'zh');
      else if (key === 'date') r = a.mtime - b.mtime;
      else r = a.size - b.size;
      return r * sortDir;
    });
    return items;
  }

  // ---------- 视频文件安全删除与级联清理 ----------
  function getNextModalIndexAfterDelete(currentIndex, totalCountBeforeDelete) {
    if (totalCountBeforeDelete <= 1) return -1;
    if (currentIndex >= totalCountBeforeDelete - 1) {
      return currentIndex - 1;
    }
    return currentIndex;
  }

  async function safeDeleteVideo(v) {
    if (!v || !activeFolderId) return;
    const cur = savedFolders.find(f => f.id === activeFolderId);
    if (!cur || !cur.handle) return;

    // 检查/请求读写权限
    let hasPerm = false;
    try {
      const status = await cur.handle.queryPermission({ mode: 'readwrite' });
      if (status === 'granted') {
        hasPerm = true;
      } else {
        const req = await cur.handle.requestPermission({ mode: 'readwrite' });
        hasPerm = (req === 'granted');
      }
    } catch (e) {
      console.error('权限申请异常:', e);
    }

    if (!hasPerm) {
      alert('未获得对本地文件夹的写入/删除权限，无法删除该文件。');
      return;
    }

    const relPath = (v.path ? v.path + '/' : '') + v.name;
    const ok = confirm(`确定要永久删除文件「${relPath}」吗？\n该操作将直接从本地磁盘中物理移除文件，不可恢复。`);
    if (!ok) return;

    try {
      const parent = v.parentHandle || cur.handle;
      if (typeof parent.removeEntry === 'function') {
        await parent.removeEntry(v.name);
      } else if (typeof v.handle.remove === 'function') {
        await v.handle.remove();
      } else {
        throw new Error('当前环境不支持 removeEntry 或 remove 接口');
      }
    } catch (err) {
      alert(`删除失败: ${err.message || err}`);
      return;
    }

    // 级联从内存列表切除
    const idxInAll = allVideos.indexOf(v);
    if (idxInAll >= 0) allVideos.splice(idxInAll, 1);
    cur.count = allVideos.length;
    saveFolderState();
    renderSidebar();

    // 级联清理收藏记录
    const favKey = getFavoriteKey(activeFolderId, v);
    if (favoriteSet.has(favKey)) {
      favoriteSet.delete(favKey);
      try {
        const db = await idbOpen();
        const tx = db.transaction('favorites', 'readwrite');
        tx.objectStore('favorites').delete(favKey);
      } catch {}
    }

    // 级联清理缩略图缓存
    try {
      const thumbKey = getThumbnailCacheKey(v);
      const db = await idbOpen();
      const tx = db.transaction('thumbnails', 'readwrite');
      tx.objectStore('thumbnails').delete(thumbKey);
    } catch {}

    // 级联清理断点续播记录
    try {
      const raw = localStorage.getItem('suishi_play_progress');
      if (raw) {
        const map = JSON.parse(raw);
        const pKey = getProgressKey(v);
        if (map[pKey]) {
          delete map[pKey];
          localStorage.setItem('suishi_play_progress', JSON.stringify(map));
        }
      }
    } catch {}

    // Modal 开启状态下的自适应索引跳转与关闭
    if (modal.classList.contains('show')) {
      const nextIdx = getNextModalIndexAfterDelete(currentModalIndex, filtered.length);
      render();
      if (nextIdx >= 0 && nextIdx < filtered.length) {
        openModal(nextIdx);
        showModalHud('🗑️ 已删除');
      } else {
        closeModal();
        setStatus(`已删除视频「${v.name}」`);
      }
    } else {
      render();
      setStatus(`已删除视频「${v.name}」`);
      setTimeout(() => {
        if (statusBar.textContent.startsWith('已删除视频')) setStatus('');
      }, 3000);
    }
  }

  function renderFolderBar() {
    folderBarEl.innerHTML = '';
    const favCount = allVideos.filter(isFavorited).length;
    const shouldShow = hasFolderGroups || favCount > 0;
    folderBarEl.classList.toggle('show', shouldShow);
    if (!shouldShow) return;

    const counts = new Map();
    for (const v of allVideos) {
      const key = topFolderOf(v);
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    const keys = Array.from(counts.keys()).sort((a, b) => {
      if (a === ROOT_GROUP) return 1;
      if (b === ROOT_GROUP) return -1;
      return a.localeCompare(b, 'zh');
    });

    const makePill = (label, count, key, extraClass = '') => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'folder-pill' + (activeFolder === key ? ' active' : '') + (extraClass ? ' ' + extraClass : '');
      if (key && key !== '__FAVORITES__') {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = colorForFolder(key);
        pill.appendChild(dot);
      }
      const name = document.createElement('span');
      name.textContent = label;
      name.title = label;
      const countEl = document.createElement('span');
      countEl.className = 'count';
      countEl.textContent = count;
      pill.appendChild(name);
      pill.appendChild(countEl);
      pill.addEventListener('click', () => { activeFolder = key; render(); });
      return pill;
    };

    folderBarEl.appendChild(makePill('全部', allVideos.length, null));
    if (favCount > 0 || activeFolder === '__FAVORITES__') {
      folderBarEl.appendChild(makePill('⭐ 已收藏', favCount, '__FAVORITES__', 'fav-pill'));
    }
    if (hasFolderGroups) {
      keys.forEach((k) => folderBarEl.appendChild(makePill(k, counts.get(k), k)));
    }
  }

  // ---------- 大目录分批渐进式挂载 (Chunked Append) ----------
  const CHUNK_SIZE = 60;
  let renderQueue = [];
  let renderedCount = 0;
  let groupSectionMap = new Map();
  const contentScroll = $('content-scroll');

  function renderNextChunk() {
    if (renderedCount >= renderQueue.length) return;

    const nextBatch = renderQueue.slice(renderedCount, renderedCount + CHUNK_SIZE);
    nextBatch.forEach(entry => {
      const { item, idx, groupName, groupTotal } = entry;

      let sectionGrid = groupSectionMap.get(groupName);
      if (!sectionGrid) {
        if (hasFolderGroups && groupName) {
          const header = document.createElement('div');
          header.className = 'group-header';
          const dot = document.createElement('span');
          dot.className = 'dot';
          dot.style.background = colorForFolder(groupName);
          const name = document.createElement('span');
          name.className = 'group-name';
          name.textContent = groupName;
          const count = document.createElement('span');
          count.className = 'group-count';
          count.textContent = `${groupTotal} 个视频`;
          header.appendChild(dot);
          header.appendChild(name);
          header.appendChild(count);
          gridEl.appendChild(header);
        }
        sectionGrid = document.createElement('div');
        sectionGrid.className = 'section-grid';
        gridEl.appendChild(sectionGrid);
        groupSectionMap.set(groupName, sectionGrid);
      }

      sectionGrid.appendChild(buildCard(item, idx));
    });

    renderedCount += nextBatch.length;
  }

  // 监听视口滚动实现无感自动追加后续切片
  let scrollTicking = false;
  contentScroll.addEventListener('scroll', () => {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
      if (renderedCount < renderQueue.length) {
        const remaining = contentScroll.scrollHeight - contentScroll.scrollTop - contentScroll.clientHeight;
        if (remaining < 600) {
          renderNextChunk();
        }
      }
      scrollTicking = false;
    });
  });

  function render() {
    if (io) { io.disconnect(); }
    io = new IntersectionObserver(onIntersect, { rootMargin: '400px' });

    renderFolderBar();

    const q = searchInput.value.trim().toLowerCase();
    let base = allVideos.filter(v => !q || v.name.toLowerCase().includes(q) || v.path.toLowerCase().includes(q));
    if (activeFolder === '__FAVORITES__') {
      base = base.filter(isFavorited);
    } else if (activeFolder) {
      base = base.filter(v => topFolderOf(v) === activeFolder);
    }

    let groups;
    if (activeFolder === '__FAVORITES__') {
      groups = [{ name: '⭐ 已收藏', items: sortGroup(base) }];
    } else if (!hasFolderGroups || activeFolder) {
      groups = [{ name: activeFolder, items: sortGroup(base) }];
    } else {
      const map = new Map();
      for (const v of base) {
        const key = topFolderOf(v);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(v);
      }
      const keys = Array.from(map.keys()).sort((a, b) => {
        if (a === ROOT_GROUP) return 1;
        if (b === ROOT_GROUP) return -1;
        return a.localeCompare(b, 'zh');
      });
      groups = keys.map(k => ({ name: k, items: sortGroup(map.get(k)) }));
    }

    filtered = [];
    renderQueue = [];
    renderedCount = 0;
    groupSectionMap.clear();
    gridEl.innerHTML = '';

    let idx = 0;
    groups.forEach(g => {
      g.items.forEach(v => {
        filtered.push(v);
        renderQueue.push({
          item: v,
          idx: idx++,
          groupName: g.name,
          groupTotal: g.items.length
        });
      });
    });

    statsEl.textContent = allVideos.length
      ? `${filtered.length} / ${allVideos.length} 个切片 · ${fmtSize(allVideos.reduce((s,v)=>s+v.size,0))}`
      : '';

    // 首屏快速挂载首批（60 个）
    renderNextChunk();
  }

  function buildCard(v, idx) {

    thumbWrap.appendChild(placeholder);

    metaEl.className = 'card-meta';

    pathEl.className = 'card-path';

    pathEl.title = v.path || '.';
    const sizeEl = document.createElement('span');
    sizeEl.textContent = fmtSize(v.size);

    metaEl.appendChild(sizeEl);

    body.appendChild(metaEl);

    card.appendChild(body);

    card._thumbWrap = thumbWrap;
    card._placeholder = placeholder;
    card._durBadge = durBadge;
    card._video = v;

    card.addEventListener('click', () => {
      if (!isPlayable) {
        openNonPlayableDialog(v);

    io.observe(card);

    return card;
  }

  function onIntersect(entries) {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        io.unobserve(entry.target);
        generateThumbnail(entry.target);
      }
    }
  }

  // 离屏提取海报与时长 (带 IndexedDB 持久化缓存池)
  function ensureThumbnail(v) {
    if (v._thumbPromise) return v._thumbPromise;
    v._thumbPromise = (async () => {
      if (!NATIVE_PLAYABLE.includes(v.ext)) return null;
      const cacheKey = getThumbnailCacheKey(v);

      // 1. 优先尝试从 IndexedDB 读取持久化缓存 (0ms 纯本地秒开)
      try {
        const cached = await idbGetThumbnail(cacheKey);
        if (cached && cached.dataUrl) {
          if (cached.duration && !v._duration) v._duration = cached.duration;
          return cached.dataUrl;
        }
      } catch {}

      // 2. 未命中缓存，进入离屏视频抽取管线
      let file, url;
      try {
        file = await v.handle.getFile();
        url = URL.createObjectURL(file);
      } catch { return null; }

      return await new Promise((resolve) => {
        const vid = document.createElement('video');
        vid.muted = true;
        vid.preload = 'metadata';
        vid.src = url;
        const cleanup = () => URL.revokeObjectURL(url);

        vid.addEventListener('loadedmetadata', () => {
          if (isFinite(vid.duration)) v._duration = vid.duration;
          const seekTo = Math.min((vid.duration || 0) * 0.15, 3);
          try { vid.currentTime = seekTo; } catch { drawFrame(); }
        }, { once: true });
        vid.addEventListener('seeked', drawFrame, { once: true });
        vid.addEventListener('error', () => { cleanup(); resolve(null); }, { once: true });

        function drawFrame() {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            const vw = vid.videoWidth, vh = vid.videoHeight;
            if (vw && vh) {
              const scale = Math.max(320 / vw, 180 / vh);
              const dw = vw * scale, dh = vh * scale;
              ctx.drawImage(vid, (320 - dw) / 2, (180 - dh) / 2, dw, dh);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
              cleanup();

              // 异步写入 IndexedDB 缓存池
              idbSetThumbnail(cacheKey, {
                dataUrl,
                duration: v._duration,
                cachedAt: Date.now()
              });

              resolve(dataUrl);
              return;
            }
          } catch {}
          cleanup();
          resolve(null);
        }
      });
    })();
    return v._thumbPromise;
  }

  async function generateThumbnail(card) {
    const v = card._video;
    const dataUrl = await ensureThumbnail(v);
    if (v._duration) {
      card._durBadge.textContent = fmtDuration(v._duration);
      card._durBadge.style.display = '';
    }
    if (dataUrl && card._placeholder) {
      const img = document.createElement('img');
      img.src = dataUrl;
      card._thumbWrap.replaceChild(img, card._placeholder);
      card._placeholder = null;
    }
  }

  // ---------- 沉浸式短视频流模式 (Feed) ----------
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildFeedSlide(v, idx) {
    const slide = document.createElement('div');
    slide.className = 'feed-slide';
    slide.dataset.idx = idx;

    const video = document.createElement('video');
    video.loop = true;
    video.playsInline = true;
    video.muted = feedMuted;
    video.volume = getSavedVolume();
    video.preload = 'none';

    video.addEventListener('volumechange', () => {
      if (!video.muted) {
        setSavedVolume(video.volume);
      }
    });

    const gradient = document.createElement('div');
    gradient.className = 'feed-gradient';

    const info = document.createElement('div');
    info.className = 'feed-info';
    const fname = document.createElement('div');
    fname.className = 'fname';
    fname.textContent = v.name;
    fname.title = v.name;
    const fpath = document.createElement('div');
    fpath.className = 'fpath';
    fpath.textContent = `${v.path ? v.path + '/' : ''}${fmtSize(v.size)}`;
    info.appendChild(fname);
    info.appendChild(fpath);

    const pauseIcon = document.createElement('div');
    pauseIcon.className = 'pause-icon';
    pauseIcon.textContent = '►';

    // 交互式进度条 (Interactive Scrubber)
    const scrubber = document.createElement('div');
    scrubber.className = 'feed-scrubber';
    const track = document.createElement('div');
    track.className = 'feed-scrubber-track';
    const bar = document.createElement('div');
    bar.className = 'feed-scrubber-bar';
    const thumb = document.createElement('div');
    thumb.className = 'feed-scrubber-thumb';
    const timeTooltip = document.createElement('div');
    timeTooltip.className = 'feed-scrubber-time';
    track.appendChild(bar);
    track.appendChild(thumb);
    track.appendChild(timeTooltip);
    scrubber.appendChild(track);

    let isDragging = false;
    let wasPlaying = false;

    video.addEventListener('timeupdate', () => {
      if (!isDragging && video.duration && isFinite(video.duration)) {
        const pct = Math.max(0, Math.min(100, (video.currentTime / video.duration) * 100));
        bar.style.width = pct + '%';
      }
    });

    function handleScrubberSeek(e) {
      const rect = track.getBoundingClientRect();
      const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const ratio = rect.width > 0 ? Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) : 0;
      const targetTime = ratio * (video.duration || 0);
      bar.style.width = (ratio * 100) + '%';
      timeTooltip.style.left = (ratio * 100) + '%';
      timeTooltip.textContent = `${fmtDuration(targetTime)} / ${fmtDuration(video.duration || 0)}`;
      return targetTime;
    }

    function onScrubberDown(e) {
      e.stopPropagation();
      e.preventDefault();
      if (!video.duration || !isFinite(video.duration)) return;
      isDragging = true;
      scrubber.classList.add('dragging');
      wasPlaying = !video.paused;
      if (wasPlaying) video.pause();
      handleScrubberSeek(e);

      function onScrubberMove(ev) {
        ev.preventDefault();
        handleScrubberSeek(ev);
      }
      function onScrubberUp(ev) {
        document.removeEventListener('mousemove', onScrubberMove);
        document.removeEventListener('mouseup', onScrubberUp);
        document.removeEventListener('touchmove', onScrubberMove);
        document.removeEventListener('touchend', onScrubberUp);
        isDragging = false;
        scrubber.classList.remove('dragging');
        const finalTime = handleScrubberSeek(ev);
        if (isFinite(finalTime)) video.currentTime = finalTime;
        if (wasPlaying) video.play().catch(() => {});
      }

      document.addEventListener('mousemove', onScrubberMove);
      document.addEventListener('mouseup', onScrubberUp);
      document.addEventListener('touchmove', onScrubberMove, { passive: false });
      document.addEventListener('touchend', onScrubberUp);
    }

    scrubber.addEventListener('mousedown', onScrubberDown);
    scrubber.addEventListener('touchstart', onScrubberDown, { passive: false });
    scrubber.addEventListener('click', (e) => e.stopPropagation());

    slide.appendChild(video);
    slide.appendChild(gradient);
    slide.appendChild(info);
    slide.appendChild(pauseIcon);
    slide.appendChild(scrubber);

    slide.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) { video.play().catch(() => {}); slide.classList.remove('paused'); }
      else { video.pause(); slide.classList.add('paused'); }
    });

    slide._video = video;
    slide._srcVideo = v;
    return slide;
  }

  async function loadFeedSlidePoster(slide) {
    if (slide._posterLoaded) return;
    slide._posterLoaded = true;
    const dataUrl = await ensureThumbnail(slide._srcVideo);
    if (dataUrl) slide._video.poster = dataUrl;
  }

  async function loadFeedSlideSrc(slide) {
    const idx = Number(slide.dataset.idx);
    if (feedLoaded.has(idx)) return;
    let file;
    try { file = await slide._srcVideo.handle.getFile(); } catch { return; }
    const url = URL.createObjectURL(file);
    slide._objectUrl = url;
    slide._video.src = url;
    slide._video.volume = getSavedVolume();
    slide._video.preload = 'auto';
    feedLoaded.add(idx);
  }

  function unloadFeedSlideSrc(slide) {
    const idx = Number(slide.dataset.idx);
    if (!feedLoaded.has(idx)) return;
    if (slide._srcVideo && slide._video.duration) {
      savePlaybackProgress(slide._srcVideo, slide._video.currentTime, slide._video.duration);
    }
    slide._video.pause();
    slide._video.removeAttribute('src');
    slide._video.load();
    if (slide._objectUrl) { URL.revokeObjectURL(slide._objectUrl); slide._objectUrl = null; }
    feedLoaded.delete(idx);
    slide.classList.remove('paused');
  }

  function activateFeedIndex(idx) {
    feedIndex = idx;
    feedCounter.textContent = `${idx + 1} / ${feedList.length}`;
    const slides = feedEl.children;
    const curSlide = slides[idx];
    if (curSlide && curSlide._srcVideo && feedFavBtn) {
      const isFav = isFavorited(curSlide._srcVideo);
      feedFavBtn.textContent = isFav ? '★' : '☆';
      feedFavBtn.classList.toggle('is-active', isFav);
    }
    for (let i = 0; i < slides.length; i++) {
      const slide = slides[i];
      if (Math.abs(i - idx) <= 1) {
        loadFeedSlideSrc(slide).then(() => {
          if (i === feedIndex && feedEl.classList.contains('show')) {
            slide._video.volume = getSavedVolume();
            slide._video.muted = feedMuted;
            const prog = getSavedProgress(slide._srcVideo);
            if (prog && prog.time >= 5 && slide._video.duration && (slide._video.duration - prog.time > 8)) {
              slide._video.currentTime = prog.time;
              showFeedHud(`已恢复至 ${fmtDuration(prog.time)} 处播放`);
            }
            slide._video.play().catch(() => {});
          }
        });
      } else {
        unloadFeedSlideSrc(slide);
      }
      if (i !== idx && slide._video.src) {
        slide._video.pause();
        slide.classList.remove('paused');
      }
    }
  }

  function openFeed(startIdx, opts = {}) {
    if (!filtered.length) return;
    feedList = opts.shuffle ? shuffleArray(filtered) : filtered.slice();
    feedIndex = opts.shuffle ? 0 : startIdx;
    feedLoaded.clear();
    feedEl.innerHTML = '';

    const frag = document.createDocumentFragment();
    feedList.forEach((v, i) => frag.appendChild(buildFeedSlide(v, i)));
    feedEl.appendChild(frag);

    feedPosterObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) loadFeedSlidePoster(e.target); });
    }, { root: feedEl, rootMargin: '150% 0px', threshold: 0 });

    feedActiveObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && e.intersectionRatio >= 0.6) {
          activateFeedIndex(Number(e.target.dataset.idx));
        }
      });
    }, { root: feedEl, threshold: [0.6] });

    Array.from(feedEl.children).forEach((slide) => {
      feedPosterObs.observe(slide);
      feedActiveObs.observe(slide);
    });

    feedEl.classList.add('show');
    feedHud.style.display = 'flex';
    feedMuteBtn.textContent = feedMuted ? '🔇' : '🔊';
    document.body.style.overflow = 'hidden';

    feedEl.children[feedIndex].scrollIntoView({ block: 'start', behavior: 'auto' });
    activateFeedIndex(feedIndex);
  }

  function closeFeed() {
    feedEl.classList.remove('show');
    feedHud.style.display = 'none';
    document.body.style.overflow = '';
    if (feedActiveObs) { feedActiveObs.disconnect(); feedActiveObs = null; }
    if (feedPosterObs) { feedPosterObs.disconnect(); feedPosterObs = null; }
    Array.from(feedEl.children).forEach(unloadFeedSlideSrc);
    feedEl.innerHTML = '';
    feedList = [];
  }

  function feedNavigate(delta) {
    const next = feedIndex + delta;
    if (next < 0 || next >= feedList.length) return;
    feedEl.children[next].scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  btnFeed.addEventListener('click', () => openFeed(0, { shuffle: feedShuffleChk.checked }));
  feedCloseBtn.addEventListener('click', closeFeed);
  feedMuteBtn.addEventListener('click', () => {
    feedMuted = !feedMuted;
    localStorage.setItem('feedMuted', String(feedMuted));
    feedMuteBtn.textContent = feedMuted ? '🔇' : '🔊';
    const cur = feedEl.children[feedIndex];
    if (cur) {
      cur._video.volume = getSavedVolume();
      cur._video.muted = feedMuted;
    }
  });

  // ---------- 弹窗全功能播放器 ----------
  modalVideo.volume = getSavedVolume();
  modalVideo.muted = getSavedMuted();
  modalVideo.addEventListener('volumechange', () => {
    setSavedVolume(modalVideo.volume);
    setSavedMuted(modalVideo.muted);
  });

  async function openModal(idx) {
    currentModalIndex = idx;
    const v = filtered[idx];
    if (!v) return;
    let file;
    try { file = await v.handle.getFile(); }
    catch { alert('无法读取该文件，可能已被移动或删除。'); return; }

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(file);
    modalVideo.playbackRate = 1.0;
    modalVideo.src = currentObjectUrl;
    modalVideo.volume = getSavedVolume();
    modalVideo.muted = getSavedMuted();
    modalInfo.textContent = `${v.path ? v.path + '/' : ''}${v.name}  ·  ${fmtSize(v.size)}  ·  ${fmtDate(v.mtime)}`;
    const isFav = isFavorited(v);
    if (modalFavBtn) {
      modalFavBtn.textContent = isFav ? '★ 已收藏' : '⭐ 收藏';
      modalFavBtn.classList.toggle('is-active', isFav);
    }
    modal.classList.add('show');
    navPrev.style.visibility = idx > 0 ? 'visible' : 'hidden';
    navNext.style.visibility = idx < filtered.length - 1 ? 'visible' : 'hidden';

    // 检查并恢复断点续播进度
    const prog = getSavedProgress(v);
    if (prog && prog.time >= 5) {
      modalVideo.addEventListener('loadedmetadata', () => {
        if (modalVideo.duration && (modalVideo.duration - prog.time > 8)) {
          modalVideo.currentTime = prog.time;
          showModalHud(`已恢复至 ${fmtDuration(prog.time)} 处播放`);
        }
      }, { once: true });
    }
  }

  let modalProgressTimer = null;
  modalVideo.addEventListener('timeupdate', () => {
    if (currentModalIndex >= 0 && filtered[currentModalIndex]) {
      const curV = filtered[currentModalIndex];
      if (!modalProgressTimer) {
        modalProgressTimer = setTimeout(() => {
          modalProgressTimer = null;
          savePlaybackProgress(curV, modalVideo.currentTime, modalVideo.duration);
        }, 2000);
      }
    }
  });

  modalVideo.addEventListener('pause', () => {
    if (currentModalIndex >= 0 && filtered[currentModalIndex]) {
      savePlaybackProgress(filtered[currentModalIndex], modalVideo.currentTime, modalVideo.duration);
    }
  });

  function closeModal() {
    if (currentModalIndex >= 0 && filtered[currentModalIndex]) {
      savePlaybackProgress(filtered[currentModalIndex], modalVideo.currentTime, modalVideo.duration);
    }
    modal.classList.remove('show');
    modalVideo.pause();
    modalVideo.removeAttribute('src');
    modalVideo.load();
    if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
    currentModalIndex = -1;
  }

  function navigate(delta) {
    const next = currentModalIndex + delta;
    if (next >= 0 && next < filtered.length) openModal(next);
  }

  modalClose.addEventListener('click', closeModal);
  modalFullscreenBtn.addEventListener('click', () => toggleFullscreen(modal));
  feedFullscreenBtn.addEventListener('click', () => toggleFullscreen(feedEl));
  if (modalFavBtn) {
    modalFavBtn.addEventListener('click', () => {
      if (currentModalIndex >= 0 && filtered[currentModalIndex]) {
        toggleFavorite(filtered[currentModalIndex]);
      }
    });
  }
  if (modalDeleteBtn) {
    modalDeleteBtn.addEventListener('click', () => {
      if (currentModalIndex >= 0 && filtered[currentModalIndex]) {
        safeDeleteVideo(filtered[currentModalIndex]);
      }
    });
  }
  if (feedFavBtn) {
    feedFavBtn.addEventListener('click', () => {
      const cur = feedEl.children[feedIndex];
      if (cur && cur._srcVideo) {
        toggleFavorite(cur._srcVideo);
      }
    });
  }
  navPrev.addEventListener('click', () => navigate(-1));
  navNext.addEventListener('click', () => navigate(1));
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  document.addEventListener('fullscreenchange', () => {
    const isFs = !!document.fullscreenElement;
    if (modalFullscreenBtn) {
      modalFullscreenBtn.textContent = isFs ? '🗗 退出' : '⛶ 全屏';
    }
  });

  document.addEventListener('keydown', (e) => {
    // 忽略表单输入焦点中的快捷键
    const activeTag = document.activeElement ? document.activeElement.tagName : '';
    if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') {
      return;
    }

    // 非原生拦截弹窗打开时
    if (npModal.classList.contains('show')) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeNonPlayableDialog();
      }
      return;
    }

    // Feed 模式下的快捷键
    if (feedEl.classList.contains('show')) {
      const curSlide = feedEl.children[feedIndex];
      const curVideo = curSlide ? curSlide._video : null;

      if (e.key === 'Escape') {
        closeFeed();
      } else if (e.key.toLowerCase() === 's') {
        e.preventDefault();
        if (curSlide && curSlide._srcVideo) {
          toggleFavorite(curSlide._srcVideo);
        }
      } else if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key.toLowerCase() === 'n') {
        e.preventDefault();
        feedNavigate(1);
      } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key.toLowerCase() === 'p') {
        e.preventDefault();
        feedNavigate(-1);
      } else if (e.key === ' ') {
        e.preventDefault();
        curSlide?.click();
      } else if (e.key === '[' || e.key === '【') {
        e.preventDefault();
        if (curVideo) {
          const spd = stepPlaybackSpeed(curVideo, -1);
          showFeedHud(`⚡ ${spd}x`);
        }
      } else if (e.key === ']' || e.key === '】') {
        e.preventDefault();
        if (curVideo) {
          const spd = stepPlaybackSpeed(curVideo, 1);
          showFeedHud(`⚡ ${spd}x`);
        }
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleFullscreen(feedEl);
      }
      return;
    }

    // Modal 弹窗模式下的快捷键
    if (modal.classList.contains('show')) {
      if (e.key === 'Escape') {
        closeModal();
      } else if (e.key.toLowerCase() === 's') {
        e.preventDefault();
        if (currentModalIndex >= 0 && filtered[currentModalIndex]) {
          toggleFavorite(filtered[currentModalIndex]);
        }
      } else if (e.key === 'Delete') {
        e.preventDefault();
        if (currentModalIndex >= 0 && filtered[currentModalIndex]) {
          safeDeleteVideo(filtered[currentModalIndex]);
        }
      } else if (e.key === ' ') {
        e.preventDefault();
        if (modalVideo.paused) {
          modalVideo.play().catch(() => {});
          showModalHud('▶ 播放');
        } else {
          modalVideo.pause();
          showModalHud('⏸ 暂停');
        }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 5;
        modalVideo.currentTime = Math.max(0, modalVideo.currentTime - step);
        showModalHud(`⏪ -${step}s (${fmtDuration(modalVideo.currentTime)})`);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 5;
        const dur = modalVideo.duration || (modalVideo.currentTime + step);
        modalVideo.currentTime = Math.min(dur, modalVideo.currentTime + step);
        showModalHud(`⏩ +${step}s (${fmtDuration(modalVideo.currentTime)})`);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const curVol = modalVideo.muted ? 0 : modalVideo.volume;
        const nextVol = Math.round(Math.min(1, curVol + 0.05) * 100) / 100;
        modalVideo.volume = nextVol;
        modalVideo.muted = false;
        showModalHud(`🔊 ${Math.round(nextVol * 100)}%`);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        const curVol = modalVideo.muted ? 0 : modalVideo.volume;
        const nextVol = Math.round(Math.max(0, curVol - 0.05) * 100) / 100;
        modalVideo.volume = nextVol;
        showModalHud(nextVol === 0 ? '🔇 静音' : `🔉 ${Math.round(nextVol * 100)}%`);
      } else if (e.key === '[' || e.key === '【') {
        e.preventDefault();
        const spd = stepPlaybackSpeed(modalVideo, -1);
        showModalHud(`⚡ ${spd}x`);
      } else if (e.key === ']' || e.key === '】') {
        e.preventDefault();
        const spd = stepPlaybackSpeed(modalVideo, 1);
        showModalHud(`⚡ ${spd}x`);
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleFullscreen(modal);
      } else if (e.key === 'PageUp' || e.key.toLowerCase() === 'p') {
        e.preventDefault();
        navigate(-1);
      } else if (e.key === 'PageDown' || e.key.toLowerCase() === 'n') {
        e.preventDefault();
        navigate(1);
      }
      return;
    }

    // 全局主界面快捷键
    if ((e.key === 'r' || e.key === 'R') && activeFolderId) {
      e.preventDefault();
      rescanActiveFolder();
    }
  });

  // ---------- 检索与排序事件 ----------
  searchInput.addEventListener('input', debounce(render, 150));
  sortKeySel.addEventListener('change', render);
  sortDirBtn.addEventListener('click', () => {
    sortDir *= -1;
    sortDirBtn.textContent = sortDir === 1 ? '↑' : '↓';
    render();
  });
  recursiveChk.addEventListener('change', () => { if (activeFolderId) loadActiveFolder(); });

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  function ensureFavicon() {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 64, 64);
      grad.addColorStop(0, '#E07A5F');
      grad.addColorStop(1, '#F28E2B');
      ctx.fillStyle = grad;
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(0, 0, 64, 64, 14);
        ctx.fill();
      } else {
        ctx.fillRect(0, 0, 64, 64);
      }
      // Tape body
      ctx.fillStyle = '#FFFFFF';
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(10, 18, 44, 28, 4);
        ctx.fill();
      } else {
        ctx.fillRect(10, 18, 44, 28);
      }
      // Tape label
      ctx.fillStyle = '#FBF9F5';
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(14, 22, 36, 14, 3);
        ctx.fill();
      } else {
        ctx.fillRect(14, 22, 36, 14);
      }
      // Spools
      ctx.fillStyle = '#2D2724';
      ctx.beginPath(); ctx.arc(22, 29, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(42, 29, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(22, 29, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(42, 29, 1.8, 0, Math.PI * 2); ctx.fill();
      // Center window
      ctx.fillStyle = '#E07A5F';
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(28, 27, 8, 4, 1);
        ctx.fill();
      } else {
        ctx.fillRect(28, 27, 8, 4);
      }
      // Bottom trapezoid
      ctx.fillStyle = '#E8E0D5';
      ctx.beginPath();
      ctx.moveTo(18, 46);
      ctx.lineTo(46, 46);
      ctx.lineTo(42, 40);
      ctx.lineTo(22, 40);
      ctx.closePath();
      ctx.fill();

      const pngUrl = canvas.toDataURL('image/png');
      let link = document.querySelector("link[rel='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.type = 'image/png';
      link.href = pngUrl;
    } catch (e) {}
  }

  // ---------- 启动引导与持久化恢复 ----------
  async function bootstrap() {
    ensureFavicon();
    initSidebar();
    renderSidebar();
    if ($('btn-open-sidebar')) {
      $('btn-open-sidebar').addEventListener('click', () => {
        sidebarEl.classList.toggle('collapsed');
        localStorage.setItem('suishi_sidebar_collapsed', sidebarEl.classList.contains('collapsed'));
      });
    }
    if (!window.showDirectoryPicker) {
      setStatus('提示：当前浏览器不支持本地文件夹原生读写，推荐使用 Chrome / Edge。');
      return;
    }

    try {
      const storedFolders = await idbGet('savedFolders');
      const storedActiveId = await idbGet('activeFolderId');
      if (Array.isArray(storedFolders) && storedFolders.length) {
        savedFolders = storedFolders;
        activeFolderId = storedActiveId && savedFolders.some(f => f.id === storedActiveId)
          ? storedActiveId
          : savedFolders[0].id;
        renderSidebar();
        await loadActiveFolder();
      } else {
        await migrateLegacyIDB();
      }
    } catch (err) {
      console.error('初始化存储失败:', err);
    }
  }

  bootstrap();
})();
</script>
