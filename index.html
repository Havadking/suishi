<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随拾 SuiShi · 本地短视频抽屉</title>
<style>
  :root {
    /* 日常亲切风 (Warm Cozy Handcraft Palette) */
    --bg-base: #FBF9F5;
    --bg-surface: #FFFFFF;
    --bg-subtle: #F6F2EB;
    --bg-hover: #EFE9DE;
    --border: #E8E0D5;
    --border-light: #F0EBE1;
    --text-main: #2D2724;
    --text-muted: #797167;
    --text-light: #A39B90;
    --accent: #E07A5F;
    --accent-hover: #D0694E;
    --accent-subtle: #FDF2EE;
    --accent-border: #F7D4C8;
    --secondary-accent: #6B8E7C;
    --danger: #E55353;
    --danger-subtle: #FDEDEC;
    --shadow-sm: 0 1px 3px rgba(65, 45, 30, 0.05), 0 1px 2px rgba(65, 45, 30, 0.04);
    --shadow-md: 0 4px 16px rgba(65, 45, 30, 0.08), 0 2px 6px rgba(65, 45, 30, 0.04);
    --shadow-lg: 0 10px 30px rgba(65, 45, 30, 0.12), 0 4px 10px rgba(65, 45, 30, 0.06);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-full: 9999px;
    --sidebar-w: 260px;
    --sidebar-collapsed-w: 64px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-base);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
  }

  /* 主应用容器：双栏布局 */
  #app-layout {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ---------- 可伸缩侧边栏 ---------- */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: width 0.24s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.24s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 20;
    user-select: none;
  }
  #sidebar.collapsed {
    width: var(--sidebar-collapsed-w);
    min-width: var(--sidebar-collapsed-w);
  }
  #sidebar.collapsed .sidebar-header {
    padding: 14px 0;
    justify-content: center;
  }
  #sidebar.collapsed .brand-wrap {
    display: none;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-light);
    height: 60px;
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
  }
  .brand-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #E07A5F, #F28E2B);
    color: #fff;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    box-shadow: 0 2px 6px rgba(224, 122, 95, 0.35);
    flex-shrink: 0;
  }
  .brand-info {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    white-space: nowrap;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-main);
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-light);
  }
  #sidebar.collapsed .brand-info {
    display: none;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover {
    background: var(--bg-subtle);
    color: var(--text-main);
    border-color: var(--border-light);
  }

  .sidebar-add-wrap {
    padding: 12px 14px;
  }
  .btn-add-folder {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--accent-subtle);
    color: var(--accent);
    border: 1px dashed var(--accent-border);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
  }
  .btn-add-folder:hover {
    background: var(--accent);
    color: #fff;
    border-style: solid;
    border-color: var(--accent);
    box-shadow: 0 3px 8px rgba(224, 122, 95, 0.25);
  }
  #sidebar.collapsed .btn-add-folder {
    padding: 8px;
  }
  #sidebar.collapsed .btn-add-folder span {
    display: none;
  }

  .sidebar-nav-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 8px 16px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #sidebar.collapsed .sidebar-nav-title {
    display: none;
  }

  .folder-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .folder-list::-webkit-scrollbar { width: 4px; }
  .folder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: var(--radius-md);
    cursor: pointer;
    position: relative;
    color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
  }
  .folder-item:hover {
    background: var(--bg-subtle);
    color: var(--text-main);
  }
  .folder-item.active {
    background: var(--accent-subtle);
    color: var(--accent);
    font-weight: 600;
  }
  .folder-item.active::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .folder-item-icon {
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    flex-shrink: 0;
  }
  .folder-item-details {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .folder-item-name {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .folder-item-sub {
    font-size: 11px;
    color: var(--text-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .folder-item.active .folder-item-sub {
    color: var(--accent);
    opacity: 0.85;
  }
  .folder-item-actions {
    display: none;
    align-items: center;
    gap: 2px;
    margin-left: auto;
  }
  .folder-item:hover .folder-item-actions {
    display: flex;
  }
  .folder-action-btn {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-light);
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }
  .folder-action-btn:hover {
    background: rgba(0,0,0,0.06);
    color: var(--text-main);
  }
  .folder-action-btn.danger:hover {
    color: var(--danger);
    background: var(--danger-subtle);
  }

  #sidebar.collapsed .folder-item {
    justify-content: center;
    padding: 10px 0;
  }
  #sidebar.collapsed .folder-item-details,
  #sidebar.collapsed .folder-item-actions {
    display: none;
  }

  .sidebar-footer {
    padding: 12px 14px;
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-light);
    background: var(--bg-surface);
  }
  #sidebar.collapsed .sidebar-footer {
    display: none;
  }

  /* ---------- 主内容区 ---------- */
  #main-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    position: relative;
    background: var(--bg-base);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 380px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-base);
    color: var(--text-main);
    outline: none;
    transition: all 0.15s;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }
  .search-wrap input::placeholder { color: var(--text-light); }

  select, .btn-normal {
    font-family: inherit;
    font-size: 13px;
    background: var(--bg-surface);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  select:hover, .btn-normal:hover { border-color: var(--accent); }
  select:disabled, .btn-normal:disabled { opacity: 0.45; cursor: default; }

  .btn-accent {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #fff;
    font-weight: 600;
    border-radius: var(--radius-md);
    padding: 7px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn-accent:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    box-shadow: 0 2px 8px rgba(224, 122, 95, 0.35);
  }
  .btn-accent:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

  label.checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  label.checkbox input { accent-color: var(--accent); cursor: pointer; }

  .spacer { flex: 1; }
  .stats {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    background: var(--bg-subtle);
    padding: 4px 10px;
    border-radius: var(--radius-full);
  }

  /* 状态栏 */
  #status-bar {
    padding: 8px 20px;
    font-size: 12.5px;
    color: var(--accent);
    background: var(--accent-subtle);
    border-bottom: 1px solid var(--accent-border);
    display: none;
    animation: fadeIn 0.15s ease;
  }
  #status-bar.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* 顶级子文件夹过滤胶囊栏 */
  #folder-bar {
    display: none;
    gap: 8px;
    padding: 10px 20px;
    overflow-x: auto;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-light);
  }
  #folder-bar.show { display: flex; }
  #folder-bar::-webkit-scrollbar { height: 4px; }
  #folder-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .folder-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: var(--radius-full);
    background: var(--bg-base);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12.5px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .folder-pill:hover {
    border-color: var(--accent);
    color: var(--text-main);
    background: var(--bg-subtle);
  }
  .folder-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(224, 122, 95, 0.25);
  }
  .folder-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .folder-pill .count {
    font-size: 11px;
    opacity: 0.8;
  }

  /* 滚动主视口 */
  #content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  #content-scroll::-webkit-scrollbar { width: 8px; }
  #content-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* 空状态 */
  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: var(--text-muted);
    text-align: center;
    gap: 16px;
    background: var(--bg-surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    margin: 20px auto;
    max-width: 560px;
  }
  #empty-state .empty-icon-wrap {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--accent-subtle);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  #empty-state h3 {
    margin: 0;
    font-size: 17px;
    color: var(--text-main);
  }
  #empty-state .hint {
    font-size: 13px;
    max-width: 440px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  /* 分组与网格 */
  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 4px 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
    font-weight: 700;
  }
  .group-header:first-child { padding-top: 0; }
  .group-header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .group-header .group-name { flex: 1; }
  .group-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-light);
    white-space: nowrap;
  }

  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }

  /* 视频卡片 */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.16s, border-color 0.16s, box-shadow 0.16s;
    position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #181614;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .card:hover .thumb-wrap img {
    transform: scale(1.02);
  }
  .thumb-wrap .placeholder {
    color: rgba(255,255,255,0.4);
  }
  .duration-badge {
    position: absolute;
    bottom: 7px;
    right: 7px;
    background: rgba(28, 23, 20, 0.78);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .ext-badge {
    position: absolute;
    top: 7px;
    left: 7px;
    background: rgba(28, 23, 20, 0.65);
    backdrop-filter: blur(4px);
    color: rgba(255,255,255,0.85);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .card-feed-btn {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(28, 23, 20, 0.75);
    backdrop-filter: blur(4px);
    color: #fff;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    z-index: 2;
    transition: background 0.15s, transform 0.15s;
  }
  .card:hover .card-feed-btn { display: flex; }
  .card-feed-btn:hover {
    background: var(--accent);
    transform: scale(1.1);
  }

  .card-body {
    padding: 9px 12px 11px;
  }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-main);
  }
  .card-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .card-path {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;
    text-align: left;
    color: var(--text-light);
  }

  /* ---------- 沉浸式短视频流模式 (Feed Mode) ---------- */
  #feed {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #000;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
  }
  #feed.show { display: block; }
  #feed::-webkit-scrollbar { display: none; }

  .feed-slide {
    position: relative;
    height: 100dvh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  .feed-slide video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    background: #000;
    object-fit: contain;
  }
  .feed-slide .feed-gradient {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 160px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4) 60%, transparent);
    pointer-events: none;
  }
  .feed-slide .feed-info {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 24px;
    color: #fff;
    font-size: 13px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .feed-slide .feed-info .fname {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed-slide .feed-info .fpath {
    opacity: 0.75;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed-slide .pause-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    color: #fff;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 3px 12px rgba(0,0,0,0.6);
    transition: opacity 0.15s ease;
  }
  .feed-slide.paused .pause-icon { opacity: 0.9; }

  .feed-hud {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 210;
    align-items: center;
    justify-content: space-between;
  }
  .feed-hud button {
    background: rgba(30, 25, 20, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .feed-hud button:hover {
    background: rgba(224, 122, 95, 0.85);
    transform: scale(1.05);
  }
  .feed-counter {
    background: rgba(30, 25, 20, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: var(--radius-full);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 弹窗全功能播放器 (Modal Player) ---------- */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(25, 20, 18, 0.85);
    backdrop-filter: blur(10px);
    z-index: 100;

  #modal.show { display: flex; }
  #modal video {

  #modal .modal-info {
    color: #fff;

    margin-top: 14px;

  /* 提示条 Tooltip */

</style>
</head>
<body>

<div id="app-layout">
  <!-- 可伸缩侧边栏 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-wrap">

        <div class="brand-info">

          <span class="brand-sub">本地短视频抽屉</span>
        </div>
      </div>
      <button id="btn-toggle-sidebar" class="icon-btn" title="折叠/展开侧边栏 (Ctrl+B)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <div class="sidebar-add-wrap">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>

    </div>

    <div class="sidebar-footer">
      <span>随手拾起 · 片刻生活</span>
      <span id="version-label">v1.2</span>

  <!-- 主内容展示区 -->
  <div id="main-wrap">
    <header>
      <div class="header-left">

    <!-- 顶级子目录快速切换胶囊栏 -->

    <!-- 视频网格与滚动区域 -->

          点击左侧「添加新目录」选取本地文件夹。<br>
          所有视频均通过现代浏览器本地权限原生读取，100% 离线、私密且安全。
        </div>

<!-- 弹窗播放器 -->
<div id="modal">

<!-- 沉浸式竖屏刷视频模式 (Feed) -->
<div class="feed-hud" id="feed-hud">
  <button id="feed-close" title="关闭 (Esc)">✕</button>
  <div class="feed-counter" id="feed-counter"></div>
  <button id="feed-mute" title="静音/取消静音">🔇</button>
</div>
<div id="feed"></div>

<script>
(() => {
  const VIDEO_EXT = ['mp4','webm','ogg','ogv','mov','m4v','mkv','avi','wmv','flv','ts'];
  const NATIVE_PLAYABLE = ['mp4','webm','ogg','ogv','m4v','mov'];

  const $ = (id) => document.getElementById(id);
  const sidebarEl = $('sidebar');
  const btnToggleSidebar = $('btn-toggle-sidebar');
  const btnAddFolder = $('btn-add-folder');
  const sidebarFolderList = $('sidebar-folder-list');
  const sidebarFolderCount = $('sidebar-folder-count');
  const btnPickEmpty = $('btn-pick-empty');

  const searchInput = $('search');
  const sortKeySel = $('sort-key');
  const sortDirBtn = $('sort-dir');
  const recursiveChk = $('recursive');
  const statsEl = $('stats');
  const statusBar = $('status-bar');
  const emptyState = $('empty-state');
  const gridEl = $('grid');
  const modal = $('modal');
  const modalVideo = $('modal-video');
  const modalInfo = $('modal-info');
  const modalClose = $('modal-close');
  const navPrev = $('nav-prev');
  const navNext = $('nav-next');
  const btnFeed = $('btn-feed');
  const feedShuffleChk = $('feed-shuffle');
  const feedEl = $('feed');
  const feedHud = $('feed-hud');
  const feedCounter = $('feed-counter');
  const feedMuteBtn = $('feed-mute');
  const feedCloseBtn = $('feed-close');
  const folderBarEl = $('folder-bar');

  const ROOT_GROUP = '（根目录）';
  const CATEGORY_COLORS = ['#E07A5F','#48C0A3','#DB5A6B','#FFA631','#8D4BBB','#21A675','#4B5CC4','#F2BE45','#F47983','#30DFF3'];
  function colorForFolder(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return CATEGORY_COLORS[hash % CATEGORY_COLORS.length];
  }

  // ---------- 应用级响应式状态 ----------
  let savedFolders = [];   // Array<{ id: string, name: string, customName?: string, handle: FileSystemDirectoryHandle, addedAt: number, count?: number }>
  let activeFolderId = null;
  let allVideos = [];      // {handle, name, path, ext, size, mtime}
  let filtered = [];       // 当前过滤后的展示数组
  let currentModalIndex = -1;
  let sortDir = 1;         // 1 asc, -1 desc (默认文件名按升序排序)
  let currentObjectUrl = null;
  let io = null;
  let activeFolder = null; // 当前顶级子文件夹筛选（null 为全部）
  let hasFolderGroups = false;

  let feedList = [];
  let feedIndex = 0;
  let feedMuted = localStorage.getItem('feedMuted') !== 'false';
  let feedActiveObs = null;
  let feedPosterObs = null;
  let feedLoaded = new Set();

  // ---------- IndexedDB 升级适配层 ----------
  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('suishi-video-db', 2);
      req.onupgradeneeded = (e) => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) {
          db.createObjectStore('kv');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, val) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // 兼容老版本 local-video-browser 数据平滑迁移
  async function migrateLegacyIDB() {
    try {
      const legacyReq = indexedDB.open('local-video-browser', 1);
      legacyReq.onsuccess = async () => {
        const oldDb = legacyReq.result;
        if (oldDb.objectStoreNames.contains('kv')) {
          const tx = oldDb.transaction('kv', 'readonly');
          const req = tx.objectStore('kv').get('dirHandle');
          req.onsuccess = async () => {
            const oldHandle = req.result;
            if (oldHandle && !savedFolders.length) {
              const legacyItem = {
                id: 'folder_' + Date.now(),
                name: oldHandle.name,
                handle: oldHandle,
                addedAt: Date.now()
              };
              savedFolders.push(legacyItem);
              activeFolderId = legacyItem.id;
              await saveFolderState();
              renderSidebar();
              loadActiveFolder();
            }
          };
        }
      };
    } catch {}
  }

  async function saveFolderState() {
    await idbSet('savedFolders', savedFolders);
    await idbSet('activeFolderId', activeFolderId);
  }

  // ---------- 侧边栏折叠/展开与状态管理 ----------
  function initSidebar() {
    const isCollapsed = localStorage.getItem('suishi_sidebar_collapsed') === 'true';
    if (isCollapsed) sidebarEl.classList.add('collapsed');

    btnToggleSidebar.addEventListener('click', () => {
      sidebarEl.classList.toggle('collapsed');
      localStorage.setItem('suishi_sidebar_collapsed', sidebarEl.classList.contains('collapsed'));
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        sidebarEl.classList.toggle('collapsed');
        localStorage.setItem('suishi_sidebar_collapsed', sidebarEl.classList.contains('collapsed'));
      }
    });
  }

  function renderSidebar() {
    sidebarFolderList.innerHTML = '';
    sidebarFolderCount.textContent = savedFolders.length;

    savedFolders.forEach((folder) => {
      const item = document.createElement('div');
      item.className = 'folder-item' + (folder.id === activeFolderId ? ' active' : '');
      const displayName = folder.customName || folder.name;
      item.setAttribute('data-tooltip', displayName);

      const icon = document.createElement('div');
      icon.className = 'folder-item-icon';
      icon.textContent = folder.id === activeFolderId ? '🎬' : '📁';

      const details = document.createElement('div');
      details.className = 'folder-item-details';

      const nameSpan = document.createElement('div');
      nameSpan.className = 'folder-item-name';
      nameSpan.textContent = displayName;
      nameSpan.title = displayName;

      const subSpan = document.createElement('div');
      subSpan.className = 'folder-item-sub';
      subSpan.textContent = folder.count != null ? `${folder.count} 个视频` : '点击载入';

      details.appendChild(nameSpan);
      details.appendChild(subSpan);

      const actions = document.createElement('div');
      actions.className = 'folder-item-actions';

      const renameBtn = document.createElement('button');
      renameBtn.className = 'folder-action-btn';
      renameBtn.title = '重命名显示名称';
      renameBtn.innerHTML = '✏️';
      renameBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const next = prompt('设置此目录在侧边栏中的别名：', displayName);
        if (next !== null && next.trim()) {
          folder.customName = next.trim();
          saveFolderState();
          renderSidebar();
        }
      });

      const removeBtn = document.createElement('button');
      removeBtn.className = 'folder-action-btn danger';
      removeBtn.title = '从侧边栏移除（不删除硬盘文件）';
      removeBtn.innerHTML = '✕';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm(`确定要从侧边栏移除「${displayName}」吗？\n（不会删除您磁盘中的视频文件）`)) {
          removeFolder(folder.id);
        }
      });

      actions.appendChild(renameBtn);
      actions.appendChild(removeBtn);

      item.appendChild(icon);
      item.appendChild(details);
      item.appendChild(actions);

      item.addEventListener('click', () => switchFolder(folder.id));
      sidebarFolderList.appendChild(item);
    });
  }

  async function removeFolder(id) {
    savedFolders = savedFolders.filter(f => f.id !== id);
    if (activeFolderId === id) {
      activeFolderId = savedFolders.length ? savedFolders[0].id : null;
    }
    await saveFolderState();
    renderSidebar();
    if (activeFolderId) {
      switchFolder(activeFolderId);
    } else {
      allVideos = [];
      filtered = [];
      gridEl.innerHTML = '';
      folderBarEl.classList.remove('show');
      statsEl.textContent = '';
      setControlsEnabled(false);
      emptyState.style.display = 'flex';
    }
  }

  async function switchFolder(id) {
    if (!id) return;
    activeFolderId = id;
    await idbSet('activeFolderId', activeFolderId);
    renderSidebar();
    await loadActiveFolder();
  }

  async function addNewFolder() {
    if (!window.showDirectoryPicker) {
      alert('当前浏览器不支持 File System Access API，请使用 Chrome 或 Edge 打开本页面。');
      return;
    }
    try {
      const handle = await window.showDirectoryPicker({ mode: 'read' });
      // 查重：若同名则提示或切换
      const existing = savedFolders.find(f => f.name === handle.name);
      if (existing) {
        existing.handle = handle;
        activeFolderId = existing.id;
      } else {
        const newFolder = {
          id: 'f_' + Date.now(),
          name: handle.name,
          handle,
          addedAt: Date.now()
        };
        savedFolders.unshift(newFolder);
        activeFolderId = newFolder.id;
      }
      await saveFolderState();
      renderSidebar();
      await loadActiveFolder();
    } catch (err) {
      if (err.name !== 'AbortError') console.error(err);
    }
  }

  btnAddFolder.addEventListener('click', addNewFolder);
  btnPickEmpty.addEventListener('click', addNewFolder);

  // ---------- 格式与辅助工具 ----------
  function isVideoFile(name) {
    const ext = name.split('.').pop().toLowerCase();
    return VIDEO_EXT.includes(ext);
  }
  function extOf(name) {
    return name.split('.').pop().toLowerCase();
  }
  function fmtSize(bytes) {
    if (bytes == null) return '';
    const units = ['B','KB','MB','GB'];
    let i = 0, v = bytes;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
  }
  function fmtDuration(sec) {
    if (!isFinite(sec) || sec < 0) return '';
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const mm = String(m).padStart(h ? 2 : 1, '0');
    const ss = String(s).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${mm}:${ss}`;
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function setStatus(msg) {
    statusBar.textContent = msg;
    statusBar.classList.toggle('show', !!msg);
  }
  function topFolderOf(v) {
    return (v.path ? v.path.split('/')[0] : '') || ROOT_GROUP;
  }
  function setControlsEnabled(enabled) {
    searchInput.disabled = !enabled;
    sortKeySel.disabled = !enabled;
    sortDirBtn.disabled = !enabled;
    recursiveChk.disabled = !enabled;
    btnFeed.disabled = !enabled;
    feedShuffleChk.disabled = !enabled;
  }

  // ---------- 目录异步扫描管道 ----------
  async function* walk(dirHandle, path, recursive) {
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file') {
        if (isVideoFile(entry.name)) yield { handle: entry, path };
      } else if (entry.kind === 'directory' && recursive) {
        yield* walk(entry, path ? `${path}/${entry.name}` : entry.name, recursive);
      }
    }
  }

  async function loadActiveFolder() {
    const cur = savedFolders.find(f => f.id === activeFolderId);
    if (!cur) return;

    // 检查权限
    try {
      const perm = await cur.handle.queryPermission({ mode: 'read' });
      if (perm !== 'granted') {
        emptyState.innerHTML = `
          <div class="empty-icon-wrap">🔒</div>
          <h3>需要重新确认读取权限</h3>
          <div class="hint">浏览器安全策略要求在重新打开或恢复会话后确认对文件夹「${cur.customName || cur.name}」的读取权限。</div>
          <button class="btn-accent" id="btn-reauth" style="margin-top:8px;">重新授权并开启</button>`;
        emptyState.style.display = 'flex';
        gridEl.innerHTML = '';
        $('btn-reauth').addEventListener('click', async () => {
          const p = await cur.handle.requestPermission({ mode: 'read' });
          if (p === 'granted') loadActiveFolder();
        });
        return;
      }
    } catch (e) {
      console.error(e);
    }

    allVideos = [];
    gridEl.innerHTML = '';
    emptyState.style.display = 'none';
    setStatus(`正在扫描「${cur.customName || cur.name}」中的视频…`);
    setControlsEnabled(false);

    const recursive = recursiveChk.checked;
    let count = 0;
    try {
      for await (const { handle: fh, path } of walk(cur.handle, '', recursive)) {
        let file;
        try { file = await fh.getFile(); } catch { continue; }
        allVideos.push({
          handle: fh,
          name: fh.name,
          path,
          ext: extOf(fh.name),
          size: file.size,
          mtime: file.lastModified,
        });
        count++;
        if (count % 25 === 0) setStatus(`正在扫描「${cur.customName || cur.name}」… 已找到 ${count} 个视频`);
      }
    } catch (err) {
      console.error('扫描出错:', err);
    }

    cur.count = allVideos.length;
    saveFolderState();
    renderSidebar();

    setStatus('');
    setControlsEnabled(true);
    emptyState.style.display = allVideos.length ? 'none' : 'flex';
    if (!allVideos.length) {
      emptyState.innerHTML = `
        <div class="empty-icon-wrap">🍃</div>
        <h3>这里空空如也</h3>
        <div class="hint">该目录（${recursive ? '含子文件夹' : '当前目录'}）未发现受支持的视频文件。</div>`;
    }

    const topKeys = new Set(allVideos.map(topFolderOf));
    hasFolderGroups = topKeys.size > 1;
    activeFolder = null;

    render();
  }

  // ---------- 检索 + 排序 + 分组 + 渲染 ----------
  function sortGroup(items) {
    const key = sortKeySel.value;
    items.sort((a, b) => {
      let r;
      if (key === 'name') r = a.name.localeCompare(b.name, 'zh');
      else if (key === 'date') r = a.mtime - b.mtime;
      else r = a.size - b.size;
      return r * sortDir;
    });
    return items;
  }

  function renderFolderBar() {
    folderBarEl.innerHTML = '';
    folderBarEl.classList.toggle('show', hasFolderGroups);
    if (!hasFolderGroups) return;

    const counts = new Map();
    for (const v of allVideos) {
      const key = topFolderOf(v);
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    const keys = Array.from(counts.keys()).sort((a, b) => {
      if (a === ROOT_GROUP) return 1;
      if (b === ROOT_GROUP) return -1;
      return a.localeCompare(b, 'zh');
    });

    const makePill = (label, count, key) => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'folder-pill' + (activeFolder === key ? ' active' : '');
      if (key) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = colorForFolder(key);
        pill.appendChild(dot);
      }
      const name = document.createElement('span');
      name.textContent = label;
      name.title = label;
      const countEl = document.createElement('span');
      countEl.className = 'count';
      countEl.textContent = count;
      pill.appendChild(name);
      pill.appendChild(countEl);
      pill.addEventListener('click', () => { activeFolder = key; render(); });
      return pill;
    };

    folderBarEl.appendChild(makePill('全部', allVideos.length, null));
    keys.forEach((k) => folderBarEl.appendChild(makePill(k, counts.get(k), k)));
  }

  function render() {
    if (io) { io.disconnect(); }
    io = new IntersectionObserver(onIntersect, { rootMargin: '400px' });

    renderFolderBar();

    const q = searchInput.value.trim().toLowerCase();
    let base = allVideos.filter(v => !q || v.name.toLowerCase().includes(q) || v.path.toLowerCase().includes(q));
    if (activeFolder) base = base.filter(v => topFolderOf(v) === activeFolder);

    let groups;
    if (!hasFolderGroups || activeFolder) {
      groups = [{ name: activeFolder, items: sortGroup(base) }];
    } else {
      const map = new Map();
      for (const v of base) {
        const key = topFolderOf(v);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(v);
      }
      const keys = Array.from(map.keys()).sort((a, b) => {
        if (a === ROOT_GROUP) return 1;
        if (b === ROOT_GROUP) return -1;
        return a.localeCompare(b, 'zh');
      });
      groups = keys.map(k => ({ name: k, items: sortGroup(map.get(k)) }));
    }

    filtered = [];
    groups.forEach(g => filtered.push(...g.items));

    statsEl.textContent = allVideos.length
      ? `${filtered.length} / ${allVideos.length} 个切片 · ${fmtSize(allVideos.reduce((s,v)=>s+v.size,0))}`
      : '';

    gridEl.innerHTML = '';
    const frag = document.createDocumentFragment();
    let idx = 0;
    groups.forEach(g => {
      if (!g.items.length) return;
      if (hasFolderGroups) {
        const header = document.createElement('div');
        header.className = 'group-header';
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = colorForFolder(g.name);
        const name = document.createElement('span');
        name.className = 'group-name';
        name.textContent = g.name;
        const count = document.createElement('span');
        count.className = 'group-count';
        count.textContent = `${g.items.length} 个视频`;
        header.appendChild(dot);
        header.appendChild(name);
        header.appendChild(count);
        frag.appendChild(header);
      }
      const sectionGrid = document.createElement('div');
      sectionGrid.className = 'section-grid';
      g.items.forEach(v => {
        sectionGrid.appendChild(buildCard(v, idx));
        idx++;
      });
      frag.appendChild(sectionGrid);
    });
    gridEl.appendChild(frag);
  }

  function buildCard(v, idx) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';

    const placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    placeholder.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 4h16v16H4z" stroke-opacity=".4"/><path d="M10 9l5 3-5 3z"/></svg>`;
    thumbWrap.appendChild(placeholder);

    const extBadge = document.createElement('div');
    extBadge.className = 'ext-badge';
    extBadge.textContent = v.ext;
    thumbWrap.appendChild(extBadge);

    const durBadge = document.createElement('div');
    durBadge.className = 'duration-badge';
    durBadge.style.display = 'none';
    thumbWrap.appendChild(durBadge);

    const feedBtn = document.createElement('button');
    feedBtn.type = 'button';
    feedBtn.className = 'card-feed-btn';
    feedBtn.title = '从这里进入刷视频模式';
    feedBtn.textContent = '▶';
    feedBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openFeed(idx);
    });
    thumbWrap.appendChild(feedBtn);

    card.appendChild(thumbWrap);

    const body = document.createElement('div');
    body.className = 'card-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = v.name;
    nameEl.title = v.name;
    body.appendChild(nameEl);

    const metaEl = document.createElement('div');
    metaEl.className = 'card-meta';
    const pathEl = document.createElement('span');
    pathEl.className = 'card-path';
    pathEl.textContent = v.path || '.';
    pathEl.title = v.path || '.';
    const sizeEl = document.createElement('span');
    sizeEl.textContent = fmtSize(v.size);
    metaEl.appendChild(pathEl);
    metaEl.appendChild(sizeEl);
    body.appendChild(metaEl);

    card.appendChild(body);

    card._thumbWrap = thumbWrap;
    card._placeholder = placeholder;
    card._durBadge = durBadge;
    card._video = v;

    card.addEventListener('click', () => openModal(idx));
    io.observe(card);

    return card;
  }

  function onIntersect(entries) {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        io.unobserve(entry.target);
        generateThumbnail(entry.target);
      }
    }
  }

  // 离屏提取海报与时长 (带 Promise 缓存)
  function ensureThumbnail(v) {
    if (v._thumbPromise) return v._thumbPromise;
    v._thumbPromise = (async () => {
      if (!NATIVE_PLAYABLE.includes(v.ext)) return null;
      let file, url;
      try {
        file = await v.handle.getFile();
        url = URL.createObjectURL(file);
      } catch { return null; }

      return await new Promise((resolve) => {
        const vid = document.createElement('video');
        vid.muted = true;
        vid.preload = 'metadata';
        vid.src = url;
        const cleanup = () => URL.revokeObjectURL(url);

        vid.addEventListener('loadedmetadata', () => {
          if (isFinite(vid.duration)) v._duration = vid.duration;
          const seekTo = Math.min((vid.duration || 0) * 0.15, 3);
          try { vid.currentTime = seekTo; } catch { drawFrame(); }
        }, { once: true });
        vid.addEventListener('seeked', drawFrame, { once: true });
        vid.addEventListener('error', () => { cleanup(); resolve(null); }, { once: true });

        function drawFrame() {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            const vw = vid.videoWidth, vh = vid.videoHeight;
            if (vw && vh) {
              const scale = Math.max(320 / vw, 180 / vh);
              const dw = vw * scale, dh = vh * scale;
              ctx.drawImage(vid, (320 - dw) / 2, (180 - dh) / 2, dw, dh);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
              cleanup();
              resolve(dataUrl);
              return;
            }
          } catch {}
          cleanup();
          resolve(null);
        }
      });
    })();
    return v._thumbPromise;
  }

  async function generateThumbnail(card) {
    const v = card._video;
    const dataUrl = await ensureThumbnail(v);
    if (v._duration) {
      card._durBadge.textContent = fmtDuration(v._duration);
      card._durBadge.style.display = '';
    }
    if (dataUrl && card._placeholder) {
      const img = document.createElement('img');
      img.src = dataUrl;
      card._thumbWrap.replaceChild(img, card._placeholder);
      card._placeholder = null;
    }
  }

  // ---------- 沉浸式短视频流模式 (Feed) ----------
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildFeedSlide(v, idx) {
    const slide = document.createElement('div');
    slide.className = 'feed-slide';
    slide.dataset.idx = idx;

    const video = document.createElement('video');
    video.loop = true;
    video.playsInline = true;
    video.muted = feedMuted;
    video.preload = 'none';

    const gradient = document.createElement('div');
    gradient.className = 'feed-gradient';

    const info = document.createElement('div');
    info.className = 'feed-info';
    const fname = document.createElement('div');
    fname.className = 'fname';
    fname.textContent = v.name;
    fname.title = v.name;
    const fpath = document.createElement('div');
    fpath.className = 'fpath';
    fpath.textContent = `${v.path ? v.path + '/' : ''}${fmtSize(v.size)}`;
    info.appendChild(fname);
    info.appendChild(fpath);

    const pauseIcon = document.createElement('div');
    pauseIcon.className = 'pause-icon';
    pauseIcon.textContent = '►';

    slide.appendChild(video);
    slide.appendChild(gradient);
    slide.appendChild(info);
    slide.appendChild(pauseIcon);

    slide.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) { video.play().catch(() => {}); slide.classList.remove('paused'); }
      else { video.pause(); slide.classList.add('paused'); }
    });

    slide._video = video;
    slide._srcVideo = v;
    return slide;
  }

  async function loadFeedSlidePoster(slide) {
    if (slide._posterLoaded) return;
    slide._posterLoaded = true;
    const dataUrl = await ensureThumbnail(slide._srcVideo);
    if (dataUrl) slide._video.poster = dataUrl;
  }

  async function loadFeedSlideSrc(slide) {
    const idx = Number(slide.dataset.idx);
    if (feedLoaded.has(idx)) return;
    let file;
    try { file = await slide._srcVideo.handle.getFile(); } catch { return; }
    const url = URL.createObjectURL(file);
    slide._objectUrl = url;
    slide._video.src = url;
    slide._video.preload = 'auto';
    feedLoaded.add(idx);
  }

  function unloadFeedSlideSrc(slide) {
    const idx = Number(slide.dataset.idx);
    if (!feedLoaded.has(idx)) return;
    slide._video.pause();
    slide._video.removeAttribute('src');
    slide._video.load();
    if (slide._objectUrl) { URL.revokeObjectURL(slide._objectUrl); slide._objectUrl = null; }
    feedLoaded.delete(idx);
    slide.classList.remove('paused');
  }

  function activateFeedIndex(idx) {
    feedIndex = idx;
    feedCounter.textContent = `${idx + 1} / ${feedList.length}`;
    const slides = feedEl.children;
    for (let i = 0; i < slides.length; i++) {
      const slide = slides[i];
      if (Math.abs(i - idx) <= 1) {
        loadFeedSlideSrc(slide).then(() => {
          if (i === feedIndex && feedEl.classList.contains('show')) {
            slide._video.muted = feedMuted;
            slide._video.play().catch(() => {});
          }
        });
      } else {
        unloadFeedSlideSrc(slide);
      }
      if (i !== idx && slide._video.src) {
        slide._video.pause();
        slide.classList.remove('paused');
      }
    }
  }

  function openFeed(startIdx, opts = {}) {
    if (!filtered.length) return;
    feedList = opts.shuffle ? shuffleArray(filtered) : filtered.slice();
    feedIndex = opts.shuffle ? 0 : startIdx;
    feedLoaded.clear();
    feedEl.innerHTML = '';

    const frag = document.createDocumentFragment();
    feedList.forEach((v, i) => frag.appendChild(buildFeedSlide(v, i)));
    feedEl.appendChild(frag);

    feedPosterObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) loadFeedSlidePoster(e.target); });
    }, { root: feedEl, rootMargin: '150% 0px', threshold: 0 });

    feedActiveObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && e.intersectionRatio >= 0.6) {
          activateFeedIndex(Number(e.target.dataset.idx));
        }
      });
    }, { root: feedEl, threshold: [0.6] });

    Array.from(feedEl.children).forEach((slide) => {
      feedPosterObs.observe(slide);
      feedActiveObs.observe(slide);
    });

    feedEl.classList.add('show');
    feedHud.style.display = 'flex';
    feedMuteBtn.textContent = feedMuted ? '🔇' : '🔊';
    document.body.style.overflow = 'hidden';

    feedEl.children[feedIndex].scrollIntoView({ block: 'start', behavior: 'auto' });
    activateFeedIndex(feedIndex);
  }

  function closeFeed() {
    feedEl.classList.remove('show');
    feedHud.style.display = 'none';
    document.body.style.overflow = '';
    if (feedActiveObs) { feedActiveObs.disconnect(); feedActiveObs = null; }
    if (feedPosterObs) { feedPosterObs.disconnect(); feedPosterObs = null; }
    Array.from(feedEl.children).forEach(unloadFeedSlideSrc);
    feedEl.innerHTML = '';
    feedList = [];
  }

  function feedNavigate(delta) {
    const next = feedIndex + delta;
    if (next < 0 || next >= feedList.length) return;
    feedEl.children[next].scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  btnFeed.addEventListener('click', () => openFeed(0, { shuffle: feedShuffleChk.checked }));
  feedCloseBtn.addEventListener('click', closeFeed);
  feedMuteBtn.addEventListener('click', () => {
    feedMuted = !feedMuted;
    localStorage.setItem('feedMuted', String(feedMuted));
    feedMuteBtn.textContent = feedMuted ? '🔇' : '🔊';
    const cur = feedEl.children[feedIndex];
    if (cur) cur._video.muted = feedMuted;
  });

  // ---------- 弹窗全功能播放器 ----------
  async function openModal(idx) {
    currentModalIndex = idx;
    const v = filtered[idx];
    if (!v) return;
    let file;
    try { file = await v.handle.getFile(); }
    catch { alert('无法读取该文件，可能已被移动或删除。'); return; }

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(file);
    modalVideo.src = currentObjectUrl;
    modalInfo.textContent = `${v.path ? v.path + '/' : ''}${v.name}  ·  ${fmtSize(v.size)}  ·  ${fmtDate(v.mtime)}`;
    modal.classList.add('show');
    navPrev.style.visibility = idx > 0 ? 'visible' : 'hidden';
    navNext.style.visibility = idx < filtered.length - 1 ? 'visible' : 'hidden';
  }

  function closeModal() {
    modal.classList.remove('show');
    modalVideo.pause();
    modalVideo.removeAttribute('src');
    modalVideo.load();
    if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
    currentModalIndex = -1;
  }

  function navigate(delta) {
    const next = currentModalIndex + delta;
    if (next >= 0 && next < filtered.length) openModal(next);
  }

  modalClose.addEventListener('click', closeModal);
  navPrev.addEventListener('click', () => navigate(-1));
  navNext.addEventListener('click', () => navigate(1));
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  document.addEventListener('keydown', (e) => {
    if (feedEl.classList.contains('show')) {
      if (e.key === 'Escape') closeFeed();
      else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); feedNavigate(1); }
      else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); feedNavigate(-1); }
      else if (e.key === ' ') { e.preventDefault(); feedEl.children[feedIndex]?.click(); }
      return;
    }
    if (!modal.classList.contains('show')) return;
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'ArrowLeft') navigate(-1);
    else if (e.key === 'ArrowRight') navigate(1);
  });

  // ---------- 检索与排序事件 ----------
  searchInput.addEventListener('input', debounce(render, 150));
  sortKeySel.addEventListener('change', render);
  sortDirBtn.addEventListener('click', () => {
    sortDir *= -1;
    sortDirBtn.textContent = sortDir === 1 ? '↑' : '↓';
    render();
  });
  recursiveChk.addEventListener('change', () => { if (activeFolderId) loadActiveFolder(); });

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  // ---------- 启动引导与持久化恢复 ----------
  async function bootstrap() {
    initSidebar();
    renderSidebar();
    if ($('btn-open-sidebar')) {
      $('btn-open-sidebar').addEventListener('click', () => {
        sidebarEl.classList.toggle('collapsed');
        localStorage.setItem('suishi_sidebar_collapsed', sidebarEl.classList.contains('collapsed'));
      });
    }
    if (!window.showDirectoryPicker) {
      setStatus('提示：当前浏览器不支持本地文件夹原生读写，推荐使用 Chrome / Edge。');
      return;
    }

    try {
      const storedFolders = await idbGet('savedFolders');
      const storedActiveId = await idbGet('activeFolderId');
      if (Array.isArray(storedFolders) && storedFolders.length) {
        savedFolders = storedFolders;
        activeFolderId = storedActiveId && savedFolders.some(f => f.id === storedActiveId)
          ? storedActiveId
          : savedFolders[0].id;
        renderSidebar();
        await loadActiveFolder();
      } else {
        await migrateLegacyIDB();
      }
    } catch (err) {
      console.error('初始化存储失败:', err);
    }
  }

  bootstrap();
})();
</script>
